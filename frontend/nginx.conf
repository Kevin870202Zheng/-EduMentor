# ==========================================================
# 智学导师 EduMentor — Nginx 生产配置
# 反向代理前端静态资源 + API 请求到 Spring Boot 后端
# ==========================================================

# 上游后端服务
upstream backend {
    server backend:8080;
}

server {
    listen 3000;
    server_name localhost;

    # 字符集
    charset utf-8;

    # 日志格式
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ==========================================================
    # 安全头部
    # ==========================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://*.aliyuncs.com;" always;

    # 关闭服务器版本号
    server_tokens off;

    # 静态资源根目录
    root /usr/share/nginx/html;

    # ==========================================================
    # Gzip 压缩
    # ==========================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ==========================================================
    # 静态资源缓存（带哈希的文件名可以长期缓存）
    # ==========================================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ==========================================================
    # API 反向代理到 Spring Boot 后端
    # ==========================================================
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（预留）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;

        # 请求体大小限制（与后端 MAX_CONTENT_LENGTH 一致，16MB）
        client_max_body_size 16m;

        # 禁用缓冲，实时转发
        proxy_buffering off;
    }

    # ==========================================================
    # 健康检查端点直接转发到后端
    # ==========================================================
    location /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # ==========================================================
    # SPA 路由支持：所有非静态资源请求返回 index.html
    # ==========================================================
    location / {
        try_files $uri $uri/ /index.html;

        # 禁止缓存 index.html（确保用户始终获取最新版本）
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # ==========================================================
    # 拒绝访问隐藏文件
    # ==========================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ==========================================================
    # 错误页面（可选：自定义错误页）
    # ==========================================================
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

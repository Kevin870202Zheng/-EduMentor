# =============================================================================
# EduMentor — 开发环境配置
# =============================================================================
# 激活方式: --spring.profiles.active=dev 或 SPRING_PROFILES_ACTIVE=dev
# =============================================================================

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/edumentor_dev}
    username: ${DATABASE_USERNAME:edumentor_dev}
    password: ${DATABASE_PASSWORD:dev@123}
  jpa:
    hibernate:
      ddl-auto: none    # Flyway 管理 Schema，Hibernate 不做校验
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    clean-disabled: true
    baseline-on-migrate: true

jwt:
  secret-key: edumentor-dev-secret-key-minimum-256-bits-please-replace-in-production

llm:
  provider: DEEPSEEK
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    api-base: ${DEEPSEEK_API_BASE:https://api.deepseek.com}

logging:
  level:
    com.edumentor: DEBUG
    org.hibernate.SQL: TRACE
    org.hibernate.type.descriptor.sql: TRACE

management:
  endpoints:
    web:
      exposure:
        include: "*"

websocket:
  allowed-origins: http://localhost:5173,http://localhost:3000

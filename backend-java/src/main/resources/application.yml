server:
  port: 8080

spring:
  application:
    name: edumentor-backend
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/edumentor?useSSL=false&serverTimezone=UTC}
    username: ${DATABASE_USERNAME:edumentor}
    password: ${DATABASE_PASSWORD:edumentor@123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: none       # Flyway 管理 Schema，Hibernate 不做校验
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        default_schema: public
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: true
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: UTC

# JWT Configuration
jwt:
  secret-key: ${JWT_SECRET_KEY:edumentor-dev-secret-key-minimum-256-bits-please-replace-in-production}
  access-token-expiration: 3600        # 1 小时（与 docker-compose 默认值一致）
  refresh-token-expiration: 2592000    # 30 天（与 docker-compose 默认值一致）
  issuer: edumentor

# LLM Configuration
llm:
  provider: DEEPSEEK
  model: deepseek-v4-pro
  temperature: 0.7
  max-tokens: 4096
  max-retries: 3
  timeout: 60
  openai:
    api-key: ${OPENAI_API_KEY:}
    api-base: https://api.openai.com
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    api-base: https://api.deepseek.com
  ollama:
    base-url: http://localhost:11434
  zhipu:
    api-key: ${ZHIPU_API_KEY:}
  wenxin:
    api-key: ${WENXIN_API_KEY:}
    secret-key: ${WENXIN_SECRET_KEY:}
  rate-limit:
    max-requests-per-minute: 60
    max-tokens-per-minute: 100000
  streaming:
    enabled: true
    buffer-size: 10

# RAG Configuration
rag:
  enabled: true
  vector-engine: false        # 是否启用向量检索引擎（替代 MockRAGEngine）
  top-k: 5
  max-context-chars: 3000
  embedding-model: text-embedding-3-small
  vector-db:
    type: memory
    path: data/vector_store.json
  chunking:
    strategy: recursive
    max-chunk-size: 500
    chunk-overlap: 50
  keyword-index:
    enabled: true
    stop-words: []
  data-dir: data/rag

# Embedding Configuration（独立于 LLM，可单独配置 embedding 供应商）
embedding:
  provider: openai     # openai / ollama
  model: ${ARK_EMBEDDING_MODEL:ep-REPLACED_MODEL}
  base-url: ${ARK_EMBEDDING_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
  api-key: ${ARK_API_KEY:}
  dimension: 1024

# BKT Configuration
bkt:
  enabled: true
  default-p-init: 0.15
  default-p-learn: 0.25
  default-p-guess: 0.15
  default-p-slip: 0.10
  mastery-threshold: 0.95
  use-default-params: true
  state:
    persist-interval: 300
    cache-size: 10000
  data-path: data/bkt

# Diagnosis Configuration
diagnosis:
  mastery-threshold: 0.80
  weak-threshold: 0.50
  zpd-range: 0.15
  max-days-back: 365
  forgetting-curve-intervals: 1,3,7,14,30,60,120

# Alert Configuration
alert:
  check-interval: 3600
  blue-threshold: 0.60
  yellow-threshold: 0.50
  orange-threshold: 0.40
  red-threshold: 0.30

# WebSocket Configuration
websocket:
  enabled: true
  endpoint: /ws/chat
  heartbeat-interval: 10000
  max-text-message-size: 65536
  max-session-idle-timeout: 1800000
  allowed-origins: http://localhost:5173,http://localhost:3000

# Logging
logging:
  level:
    root: INFO
    com.edumentor: DEBUG
    org.springframework: WARN
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    org.springframework.security: WARN

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# Springdoc (Swagger)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    syntax-highlight:
      theme: monokai

# File upload (future)
file:
  upload:
    max-size: 10485760
    allowed-extensions: jpg,jpeg,png,gif,pdf,doc,docx
    upload-dir: uploads

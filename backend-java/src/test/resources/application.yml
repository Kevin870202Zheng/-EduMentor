spring:
  application:
    name: edumentor-test

  datasource:
    url: jdbc:h2:mem:edumentor_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSXXX
    time-zone: UTC
    property-naming-strategy: LOWER_CAMEL_CASE

jwt:
  secret-key: dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RzLW11c3QtYmUtYXQtbGVhc3QtMjU2LWJpdHMtbG9uZw==
  access-token-expiration: 1800
  refresh-token-expiration: 604800
  issuer: edumentor-test

llm:
  provider: MOCK
  temperature: 0.7
  max-tokens: 1024
  timeout: 30
  openai:
    api-key: test-key
    api-base: http://localhost:9999

rag:
  enabled: false
  top-k: 5
  max-context-chars: 3000
  embedding-model: text-embedding-3-small
  vector-db:
    type: memory
  chunking:
    strategy: recursive
    max-chunk-size: 500
    chunk-overlap: 50
  keyword-index:
    enabled: false

logging:
  level:
    com.edumentor: DEBUG
    org.springframework: WARN
    org.hibernate: WARN

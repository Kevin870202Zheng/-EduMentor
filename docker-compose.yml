# =============================================================================
# EduMentor — Docker Compose 开发环境配置
# =============================================================================
# 服务:
#   backend    — Spring Boot 3 后端 (Java 21)
#   frontend   — React 前端 (Vite + TypeScript)
#   db         — PostgreSQL 16 数据库
#   tts-service — edge-tts 语音合成微服务 (Python)
# =============================================================================

services:
  # ---- Spring Boot 后端 ----
  backend:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
      args:
        - MAVEN_OPTS=-Dmaven.test.skip=true
    container_name: edumentor-app
    ports:
      - "${APP_PORT:-8080}:8080"
      - "${ACTUATOR_PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-edumentor}
      DATABASE_USERNAME: ${POSTGRES_USER:-edumentor}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-edumentor-dev-secret-key-change-in-production}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-3600}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION:-2592000}
      RAG_ENABLED: ${RAG_ENABLED:-true}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ARK_API_KEY: ${ARK_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://82.156.203.220:3000}
      LOGGING_LEVEL_COM_EDUMENTOR: ${LOGGING_LEVEL_COM_EDUMENTOR:-DEBUG}
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-true}
      TTS_SERVICE_URL: http://tts-service:5080
      TZ: Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
      tts-service:
        condition: service_started
    volumes:
      - rag_data:/app/data/rag
      - bkt_data:/app/data/bkt
      - app_logs:/app/logs
    restart: unless-stopped
    networks:
      - edumentor-net

  # ---- React 前端 ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api
    container_name: edumentor-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - edumentor-net

  # ---- edge-tts 语音合成微服务 ----
  tts-service:
    build:
      context: ./tts-service
      dockerfile: Dockerfile
    container_name: edumentor-tts
    ports:
      - "${TTS_PORT:-5080}:5080"
    environment:
      TTS_AUDIO_DIR: /app/audio
      TTS_PORT: 5080
    volumes:
      - tts_audio:/app/audio
    restart: unless-stopped
    networks:
      - edumentor-net

  # ---- PostgreSQL 数据库（含 PGVector 向量扩展） ----
  db:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: edumentor-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edumentor}
      POSTGRES_USER: ${POSTGRES_USER:-edumentor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend-java/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edumentor} -d ${POSTGRES_DB:-edumentor}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - edumentor-net

volumes:
  postgres_data:
    name: edumentor_postgres_data
  rag_data:
    name: edumentor_rag_data
  bkt_data:
    name: edumentor_bkt_data
  app_logs:
    name: edumentor_app_logs
  tts_audio:
    name: edumentor_tts_audio

networks:
  edumentor-net:
    driver: bridge
    name: edumentor_network
